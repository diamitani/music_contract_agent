id: nda-non-circumvention-agreement
title: NDA / Non-Circumvention Agreement
status: original
category: protective_and_general
rights_affected:
- confidentiality
parties:
- Party A
- Party B
template_file: nda-non-circumvention-agreement.md
questionnaire_file: nda-non-circumvention-agreement-questionnaire.md
money_fields:
- Typically no payment terms — this is a protective document, not a deal itself
rights_grant_notes:
- Confirms this grants NO license or ownership of anything — it only protects information and relationships
  while a deal is being discussed
control_fields:
- Duration of confidentiality (2-3 years is typical) and non-circumvention (1-2 years)
- Whether this is mutual (both sides protected) or should be one-directional
risk_flags:
- severity: green
  text: signing this before sharing an unreleased track, deal terms, or a business introduction is a low-cost,
    high-value habit — encourage it even for casual-seeming conversations.
- severity: yellow
  text: if only one party is actually disclosing sensitive information, consider whether a one-way (unilateral)
    version is more appropriate than mutual — ask which direction the sensitive info is flowing.
intake_questions:
- What's actually being protected — an unreleased song, a business plan, deal terms, a contact introduction?
- Is information flowing both ways (mutual) or mostly one direction (should be unilateral instead)?
- Is there a specific introduction (a contact, a potential deal) that needs non-circumvention protection,
  and for how long?
