id: booking-agent-agreement
title: Booking / Talent Agent Agreement
status: sourced
category: management_and_booking
rights_affected:
- income_royalty_recoupment
- exclusivity_noncompete
- term_renewal_termination
parties:
- Artist
- Agent
template_file: booking-agent-agreement.md
questionnaire_file: booking-agent-agreement-questionnaire.md
money_fields:
- Commission rate on gross performance fees (industry norm ~10-20%)
- Who pays deposit/travel/rider costs and whether they're deducted before or after commission
- Minimum guarantee or fee floor the agent must secure, if any
rights_grant_notes:
- Agent is granted the right to solicit and negotiate performance offers on artist's behalf — not ownership
  of anything
control_fields:
- Exclusive vs. non-exclusive, and for which territory (city/region/country/worldwide)
- Whether the artist must run other offers through the agent or can self-book certain shows
- Term and notice period to terminate
- Whether the agent needs artist sign-off before accepting an offer, or has standing authority up to a
  certain fee
risk_flags:
- severity: yellow
  text: worldwide exclusivity when the agent only actually has relationships in one region.
- severity: yellow
  text: no minimum activity requirement — agent can sit on exclusive rights without booking anything.
- severity: red
  text: agent given authority to accept offers and bind the artist without prior approval.
intake_questions:
- What territory does this agent actually work — local, regional, national, international?
- Should the artist be able to book shows themselves without commission, or is everything exclusive?
- What's the agreed commission percentage, and is it before or after travel/production costs?
- Is there a minimum number of shows/income the agent must deliver to keep the exclusive?
